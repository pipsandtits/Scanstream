global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'scanstream'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000', 'scanner:5001']

  # Prometheus internal metrics (optional)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# NOTE: Adjust targets above to match services exposing Prometheus metrics
# e.g., if your Node backend exposes metrics on /metrics at a different port,
# update the static_configs accordingly.
